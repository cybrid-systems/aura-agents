name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cybrid-systems/aura-ci@sha256:66392ce2a5f24668fb923d1c900c545435f6b453f3df585dc4668402c07042d5
    steps:
      - uses: actions/checkout@v4
      - name: Orchestra baseline drift (#13)
        run: python3 scripts/check-baseline.py --self
      - name: Baseline bump generator self-test (#13)
        run: python3 scripts/bump-baseline.py --self-test
      - name: Install Aura nightly
        run: echo "$(bash scripts/install-aura.sh)" >> "$GITHUB_PATH"
      - name: Test
        env:
          AURA_AGENTS_LLM: mock
        run: aura test
      - name: Mock-LLM demo smoke
        env:
          AURA_AGENTS_LLM: mock
        run: bash scripts/smoke.sh
      - name: Live replay smoke (#15)
        env:
          AURA_AGENTS_LLM: mock
        run: bash scripts/replay-smoke.sh
      - name: Scaffold dry-run (#22)
        env:
          AURA_AGENTS_LLM: mock
        run: bash scripts/scaffold-dry-run.sh
      - name: COW live check (#29)
        env:
          AURA_AGENTS_LLM: mock
        run: bash scripts/cow-live-check.sh
      - name: Shell and Python syntax
        run: |
          bash -n scripts/demo-redis.sh scripts/finalize-redis.sh scripts/agent-task.sh scripts/replay-smoke.sh scripts/live-acceptance.sh scripts/scaffold-dry-run.sh scripts/cow-live-check.sh
          python3 -m py_compile scripts/check-baseline.py scripts/bump-baseline.py tests/fixtures/redis_fixture.py tests/fixtures/runner_fixture.py
